name: CI — Build & Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # --- THÊM PHẦN NÀY: Khởi tạo MySQL Service ---
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: auction_db
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    # --------------------------------------------

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build, test and checkstyle
        # Chờ MySQL sẵn sàng và chạy verify
        run: mvn verify --batch-mode -DskipTests=false
        env:
          # Các biến môi trường nếu code của bạn dùng để kết nối
          DB_URL: jdbc:mysql://localhost:3306/auction_db
          DB_USER: root
          DB_PASSWORD: ""

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/